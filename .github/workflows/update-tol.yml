name: Semak harga tol

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang pakej
        run: pip install requests beautifulsoup4 lxml
      - name: Semak harga
        id: chk
        run: python scripts/update_tol.py
      - name: Simpan dan bina APK baru jika harga berubah
        if: steps.chk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "jomapz-bot"
          git config user.email "jomapz-bot@users.noreply.github.com"
          git add www/tol.json
          git commit -m "Kemas kini harga tol"
          git push
          gh workflow run build-apk.yml --ref main
