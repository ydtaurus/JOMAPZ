name: Build APK

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 0"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod
        uses: actions/checkout@v4

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang pakej
        run: npm install

      - name: Tambah projek Android
        run: npx cap add android

      - name: Jana ikon JOMAPZ
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Data OSM Malaysia (tempat, kamera, lampu isyarat, lorong)
        continue-on-error: true
        run: |
          pip install osmium
          curl -fL --retry 3 -o malaysia.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
          ls -l malaysia.osm.pbf
          mkdir -p www/data
          python3 scripts/build_osm_data.py malaysia.osm.pbf www/data/osm.json
          ls -l www/data/osm.json

      - name: Tandatangan tetap (supaya kemas kini boleh dipasang di atas versi lama)
        env:
          KS: ${{ secrets.JOMAPZ_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \n\r' | base64 -d > "$HOME/jomapz.keystore"
            keytool -list -keystore "$HOME/jomapz.keystore" -storepass android | tail -2
            python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p).read()
          blk="    signingConfigs {\n        debug {\n            storeFile file('%s/jomapz.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n" % os.environ['HOME']
          s=re.sub(r'(\nandroid \{\n)', lambda m:m.group(1)+blk, s, count=1)
          open(p,'w').write(s)
          PY
            grep -n "signingConfigs" -A3 android/app/build.gradle
            echo "Kunci tetap digunakan"
          else
            echo "::warning::JOMAPZ_KEYSTORE_B64 tiada. APK ini ditandatangan dengan kunci rawak dan tidak boleh dikemas kini di atas versi lama."
          fi

      - name: Terima kongsi dari Google Maps (Android)
        run: |
          cp native/MainActivity.java android/app/src/main/java/my/jomapz/app/MainActivity.java
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter>'
          i=s.index('</activity>')
          s=s[:i]+f+s[i:]
          open(p,'w').write(s)
          PY
          grep -n "SEND" android/app/src/main/AndroidManifest.xml

      - name: Ikon notifikasi bar atas (siluet pin)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_jomapz.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd" android:pathData="M12,1.5C7.86,1.5 4.5,4.86 4.5,9c0,5.6 7.5,13.5 7.5,13.5s7.5,-7.9 7.5,-13.5C19.5,4.86 16.14,1.5 12,1.5zM12,12a3,3 0 1,1 0,-6 3,3 0 0,1 0,6z"/>
          </vector>
          XML
          python3 - <<'PY'
          p='android/app/src/main/res/values/strings.xml'
          s=open(p).read()
          s=s.replace('</resources>','    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_jomapz</string>\n</resources>')
          open(p,'w').write(s)
          PY
          grep -n "notification_icon" android/app/src/main/res/values/strings.xml

      - name: Kunci TomTom (pilihan, dari GitHub Secret)
        env:
          TT: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          if [ -n "$TT" ]; then
            printf '{"tt":"%s"}' "$TT" > www/config.json
            echo "Kunci TomTom dimasukkan ke dalam APK"
          else
            echo '{}' > www/config.json
            echo "TOMTOM_API_KEY tiada. Ciri jalan ditutup senyap."
          fi

      - name: Nombor versi
        run: |
          echo '{"build":${{ github.run_number }}}' > www/version.json
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.3.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync fail web ke Android
        run: npx cap sync android

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sahkan tandatangan
        env:
          KS: ${{ secrets.JOMAPZ_KEYSTORE_B64 }}
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "owner"
          if [ -n "$KS" ]; then keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -q "O=Pratama Yudha" || { echo "::error::APK tidak guna kunci JOMAPZ"; exit 1; }; fi

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: jomapz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JOMAPZ.apk
          gh release create "build-${{ github.run_number }}" JOMAPZ.apk --title "JOMAPZ build ${{ github.run_number }}" --notes "JOMAPZ oleh Pratama Yudha. Muat turun JOMAPZ.apk dan install di Android."
