name: Probe share link
on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Google Maps share link'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Follow link and list coordinate candidates
        env:
          LINK: ${{ inputs.link }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sSL -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -b "CONSENT=YES+cb; SOCS=CAI" -o body.html -w "FINAL_URL=%{url_effective}\nHTTP=%{http_code}\nREDIRECTS=%{num_redirects}\n" "$LINK"
          echo "--- size"; wc -c body.html
          echo "--- !3d!4d in body"; grep -oE '!3d-?[0-9]+\.[0-9]+!4d-?[0-9]+\.[0-9]+' body.html | sort | uniq -c | sort -rn | head -10
          echo "--- center="; grep -oE 'center=-?[0-9]+\.[0-9]+(%2C|,)-?[0-9]+\.[0-9]+' body.html | head -5
          echo "--- [null,null,lat,lng]"; grep -oE '\[null,null,-?[0-9]+\.[0-9]+,-?[0-9]+\.[0-9]+\]' body.html | head -10
          echo "--- APP_INITIALIZATION_STATE"; grep -oE 'APP_INITIALIZATION_STATE=\[\[\[[^]]{0,80}\]' body.html | head -3
          echo "--- og/meta"; grep -oE '<meta[^>]+(og:image|og:title|itemprop="name")[^>]*>' body.html | head -5
